# 楽天ROOM投稿カレンダーのイベント設定
#
# recurring: 毎月決まった日に繰り返し発生するイベント(自動計算)
# campaigns: 楽天スーパーSALE・お買い物マラソンなど、開催時期がその都度アナウンスされる
#            キャンペーン。公式発表され次第、日程をここに追記してください。
#            (公開APIが無いため自動取得はできません)

recurring:
  - name: "5と0のつく日"
    rule: "day_of_month_in"
    days: [5, 10, 15, 20, 25, 30]
    note: "楽天カード利用でポイント+2倍の日。ポイント訴求の下書き(draft_review/draft_sale)がおすすめ"
  - name: "ワンダフルデー"
    rule: "day_of_month_in"
    days: [1]
    note: "毎月1日のポイントアップキャンペーン日"

campaigns:
  # 例(実際の日程が発表されたらコメントを外して日付を書き換えてください):
  # - name: "楽天スーパーSALE"
  #   start: "2026-XX-XX"
  #   end: "2026-XX-XX"
  #   note: "全ジャンルでセール品が増える。セール訴求の下書きを多めに用意する"
  # - name: "お買い物マラソン"
  #   start: "2026-XX-XX"
  #   end: "2026-XX-XX"
  #   note: "エントリー必須。複数ショップでの購入を促す文言が効果的"
