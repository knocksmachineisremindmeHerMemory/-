# 投稿文チェック用のNGワード・表示ルール設定
#
# overclaim: 薬機法・景品表示法上リスクのある誇大表現の候補
#            (医薬品的な効能効果を暗示する表現や、根拠のない完全性・No.1表現など)
#            ヒットしても即違法というわけではなく、文脈次第で問題ないケースもあるため、
#            「注意喚起」として扱ってください。最終判断は自身で行うか専門家に確認してください。
overclaim:
  - "絶対"
  - "100%"
  - "必ず"
  - "完全に治る"
  - "治る"
  - "完治"
  - "医学的に証明"
  - "副作用なし"
  - "副作用がない"
  - "日本一"
  - "世界一"
  - "No.1"
  - "永久に"
  - "即効性"

# disclosure_required_platforms: 広告・アフィリエイトである旨の明示(ステマ規制対応)が
# 特に必要なプラットフォーム。2023年施行の景品表示法ステマ規制により、
# 経済的利益関係がある場合は広告である旨を明示する必要がある。
disclosure_required_platforms:
  - "threads"
  - "x"

disclosure_keywords:
  - "PR"
  - "広告"
  - "プロモーション"
  - "アフィリエイト"
  - "sponsored"

# 助詞の連続(誤字の可能性)を検出する対象
particle_repeat_check:
  - "は"
  - "が"
  - "を"
  - "に"
  - "で"
  - "と"
  - "も"
  - "へ"
